name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build EXE
        shell: cmd
        run: build_exe.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-Windows
          path: |
            dist/**
